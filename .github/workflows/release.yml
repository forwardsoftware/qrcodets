name: Release

on:
  schedule:
    - cron: "0 17 * * 2" # Weekly on Tuesday evenings
  workflow_dispatch:
    inputs:
      dry-run:
        description: Compute the next version and release notes without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release

jobs:
  release:
    name: Release

    runs-on: ubuntu-latest

    permissions:
      contents: write # create the tag and GitHub release
      id-token: write # npm trusted publishing

    env:
      NOTES: ${{ runner.temp }}/RELEASE_NOTES.md

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          args: --unreleased --bump --strip all --output ${{ runner.temp }}/RELEASE_NOTES.md

      # git-cliff reports the latest tag as the next version when nothing is releasable
      - name: Check for releasable changes
        id: check
        env:
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          if ! grep -q '[^[:space:]]' "$NOTES" || git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "No releasable changes since the last release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            { echo "## $VERSION"; echo; cat "$NOTES"; } >> "$GITHUB_STEP_SUMMARY"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.check.outputs.release == 'true'
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          install: false

      - name: Setup NodeJS
        if: steps.check.outputs.release == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: latest
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        if: steps.check.outputs.release == 'true'
        run: pnpm i --frozen-lockfile

      - name: Build package
        if: steps.check.outputs.release == 'true'
        run: pnpm build

      - name: Set package version
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.notes.outputs.version }}
        run: npm version "${VERSION#v}" --no-git-tag-version --allow-same-version

      # Skipping an already published version lets a failed run be retried safely
      - name: Publish package
        if: steps.check.outputs.release == 'true' && !inputs.dry-run
        env:
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          name="$(jq -r .name package.json)"
          if [[ -n "$(npm view "$name@${VERSION#v}" version 2>/dev/null)" ]]; then
            echo "$name@${VERSION#v} is already published"
          else
            npm publish
          fi

      - name: Create GitHub release
        if: steps.check.outputs.release == 'true' && !inputs.dry-run
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.notes.outputs.version }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file "$NOTES"
